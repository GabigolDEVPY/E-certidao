server {
    listen 80;
    server_name certidaobr.com www.certidaobr.com xn--certidobr-q2a.com www.xn--certidobr-q2a.com;

    # Redireciona tudo para HTTPS (descomente quando tiver SSL)
    # return 301 https://$host$request_uri;

    # ── Estáticos (collectstatic) ──────────
    location = /google971862346ff0bb4b.html {
        alias /home/ubuntu/E-certidao/google971862346ff0bb4b.html;
        default_type text/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location = /favicon.ico {
        alias /home/ubuntu/E-certidao/staticfiles/favicon.ico;
        default_type image/x-icon;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/(favicon-(16x16|32x32|48x48|96x96)\.png|apple-touch-icon\.png|android-chrome-(192x192|512x512)\.png)$ {
        alias /home/ubuntu/E-certidao/staticfiles/$1;
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /site.webmanifest {
        alias /home/ubuntu/E-certidao/staticfiles/site.webmanifest;
        default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /home/ubuntu/E-certidao/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Media uploads ──────────────────────
    location /media/ {
        alias /home/ubuntu/E-certidao/media/;
        expires 7d;
        access_log off;
    }

    # ── Django via Gunicorn ────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 10M;
    }
}

